name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  # Font bauen und mit harfbuzz gegen die Engine prüfen, dann die statische Seite bauen
  font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.2
      - run: bun install --frozen-lockfile
      - run: bun run web
